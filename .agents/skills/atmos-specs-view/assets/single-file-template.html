<!doctype html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{PAGE_TITLE}}</title>
  <!-- Optional CDN slots. Keep the final artifact as one HTML file; no local assets. -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  {{CDN_HEAD}}
  <style>
    /* {{DESIGN_STYLE_CSS}} */
    /* Must include Markdown rendering baseline from SKILL.md:
       .markdown pre code { background: transparent; color: inherit; border-radius: 0; padding: 0; font-size: inherit; }
       .markdown pre { overflow-x: auto; white-space: pre; }
    */
  </style>
</head>
<body data-view-mode="single-file" data-style="{{STYLE_NAME}}">
  <div id="app-shell">
    <header id="hero" data-sticky-header>
      <p id="eyebrow">{{SPEC_ID}} / {{FILE_NAME}}</p>
      <h1>{{DOCUMENT_TITLE}}</h1>
      <p id="summary">{{DOCUMENT_SUMMARY}}</p>
      <div id="hero-meta">
        <span>{{SOURCE_PATH}}</span>
        <span>{{GENERATED_AT}}</span>
      </div>
      <div id="hero-actions">
        <button type="button" data-action="open-source">{{UI_OPEN_SOURCE}}</button>
        <button type="button" data-action="open-review">{{UI_OPEN_REVIEW}}</button>
        <button type="button" data-action="copy-agent-prompt">{{UI_COPY_AGENT_PROMPT}}</button>
        <button type="button" data-action="copy-json">{{UI_COPY_JSON}}</button>
      </div>
    </header>

    <main id="layout">
      <aside id="document-map" aria-label="{{UI_DOCUMENT_STRUCTURE}}">
        <h2>{{UI_DOCUMENT_STRUCTURE}}</h2>
        <nav id="heading-list"><!-- {{HEADING_LIST}} --></nav>
        <section id="structured-extraction"><!-- {{FILE_TYPE_STRUCTURED_EXTRACTION}} --></section>
        <section id="diagrams"><!-- {{FILE_TYPE_MERMAID_DIAGRAMS}} --></section>
        <section id="signals"><!-- {{CONTENT_QUALITY_SIGNALS}} --></section>
      </aside>
    </main>

    <dialog id="source-dialog" aria-labelledby="source-dialog-title">
      <section id="source-panel" aria-label="{{UI_SOURCE_DOCUMENTS}}">
        <header id="source-dialog-header">
          <h2 id="source-dialog-title">{{UI_SOURCE_DOCUMENTS}}</h2>
          <button type="button" data-action="close-source" aria-label="{{UI_CLOSE}}">{{UI_CLOSE}}</button>
        </header>
        <div id="document-toolbar">
          <button type="button" data-action="show-rendered">{{UI_RENDERED}}</button>
          <button type="button" data-action="show-source">{{UI_RAW_MARKDOWN}}</button>
          <button type="button" data-action="copy-source">{{UI_COPY_MARKDOWN}}</button>
        </div>
        <article id="markdown-rendered"><!-- markdown rendered by {{MARKDOWN_RENDERER}} --></article>
        <pre id="markdown-source" hidden>{{MARKDOWN_SOURCE_ESCAPED}}</pre>
      </section>
    </dialog>

    <dialog id="review-dialog" aria-labelledby="review-dialog-title">
      <section id="review-panel" aria-label="{{UI_REVIEW}}">
        <header id="review-dialog-header">
          <h2 id="review-dialog-title">{{UI_REVIEW}}</h2>
          <button type="button" data-action="close-review" aria-label="{{UI_CLOSE}}">{{UI_CLOSE}}</button>
        </header>
        <section id="section-decisions"><!-- {{SECTION_DECISION_CONTROLS}} --></section>
        <label for="global-notes">{{UI_OVERALL_NOTES}}</label>
        <textarea id="global-notes" data-feedback="global_notes" placeholder="{{UI_OVERALL_NOTES_PLACEHOLDER}}"></textarea>
      </section>
    </dialog>
  </div>

  <script type="application/json" id="spec-view-data">
    {{SPEC_VIEW_DATA_JSON_SAFE}}
  </script>
  <script>
    /* Inline `assets/interaction-script-template.js` here and adapt only if the DOM ids differ. */
    {{INTERACTION_SCRIPT}}
  </script>
</body>
</html>
