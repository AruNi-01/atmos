[package]
name = "browser-cookies"
version = "0.1.0"
edition = "2021"
description = "Local, on-device browser cookie extraction (Chromium family + Firefox) for macOS. Leaf crate: no Tauri, no app dependencies."

[dependencies]
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
