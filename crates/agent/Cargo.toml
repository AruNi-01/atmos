[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
keyring = "3.6.1"
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
which = "6.0"
zip = "2.4"
flate2 = "1.1"
tar = "0.4"
tempfile = "3.15"

[features]
default = []
test-support = []
