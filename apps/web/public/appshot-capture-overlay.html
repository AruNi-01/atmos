<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /*
        Keep this cheap on Electron transparent windows:
        - animate opacity only (GPU-friendly)
        - no multi-layer blurred box-shadow keyframes (main-thread paint + full-window composite)
        - no scale transforms on a near-fullscreen surface
      */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      .frame {
        position: fixed;
        inset: 10px;
        /* Brighter electric blue + white outer ring — still opacity-only anim */
        border: 4px solid rgba(56, 189, 255, 1);
        border-radius: 14px;
        /* solid rings only — avoid blurred glow on transparent Electron windows */
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.95),
          0 0 0 5px rgba(14, 165, 233, 0.85);
        opacity: 0;
        transform: translateZ(0);
        will-change: opacity;
      }

      .flash {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.72);
        opacity: 0;
        transform: translateZ(0);
        will-change: opacity;
      }

      body.run .frame {
        animation: appshot-border-pulse 380ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      body.run .flash {
        animation: appshot-camera-flash 300ms cubic-bezier(0.2, 0.8, 0.2, 1) 30ms both;
      }

      @keyframes appshot-border-pulse {
        0% {
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        55% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes appshot-camera-flash {
        0% {
          opacity: 0;
        }
        15% {
          opacity: 0.75;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="flash"></div>
    <script>
      // Called from the desktop shell to restart the one-shot animation without
      // reloading the page (reloading re-creates the renderer and feels laggy).
      window.__atmosAppshotPlay = function () {
        document.body.classList.remove("run");
        // Force reflow so re-adding the class restarts CSS animations.
        void document.body.offsetWidth;
        document.body.classList.add("run");
      };
    </script>
  </body>
</html>
