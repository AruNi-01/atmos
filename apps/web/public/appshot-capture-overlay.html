<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /*
        Keep this cheap on Electron transparent windows:
        - animate opacity only (GPU-friendly)
        - no multi-layer blurred box-shadow keyframes (main-thread paint + full-window composite)
        - no scale transforms on a near-fullscreen surface
      */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      .frame {
        position: fixed;
        inset: 12px;
        border: 3px solid rgba(66, 153, 255, 0.98);
        border-radius: 14px;
        /* solid ring only — blur/glow forces huge transparent surface repaints */
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
        opacity: 0;
        transform: translateZ(0);
        will-change: opacity;
      }

      .flash {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.55);
        opacity: 0;
        transform: translateZ(0);
        will-change: opacity;
      }

      body.run .frame {
        animation: appshot-border-pulse 480ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      body.run .flash {
        animation: appshot-camera-flash 360ms cubic-bezier(0.2, 0.8, 0.2, 1) 80ms both;
      }

      @keyframes appshot-border-pulse {
        0% {
          opacity: 0;
        }
        22% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes appshot-camera-flash {
        0% {
          opacity: 0;
        }
        18% {
          opacity: 0.55;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="flash"></div>
    <script>
      // Called from the desktop shell to restart the one-shot animation without
      // reloading the page (reloading re-creates the renderer and feels laggy).
      window.__atmosAppshotPlay = function () {
        document.body.classList.remove("run");
        // Force reflow so re-adding the class restarts CSS animations.
        void document.body.offsetWidth;
        document.body.classList.add("run");
      };
    </script>
  </body>
</html>
