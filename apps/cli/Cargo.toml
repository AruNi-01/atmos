[package]
name = "atmos"
version = "2026.7.2"
edition = "2021"

[dependencies]
base64 = "0.22"
clap = { workspace = true }
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = "1.0"
sysinfo = "0.30"
tokio = { workspace = true }
runtime-manager = { path = "../../crates/runtime-manager", features = ["supervisor"] }
