[package]
name = "atmos"
version = "2026.8.7"
edition = "2021"

[dependencies]
base64 = "0.22"
clap = { workspace = true }
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { workspace = true }
serde_json = "1.0"
urlencoding = "2.1"
sysinfo = "0.30"
tokio = { workspace = true }
runtime-manager = { path = "../../crates/runtime-manager", features = ["supervisor"] }
desktop-use = { path = "../../crates/desktop-use" }
browser-use = { path = "../../crates/browser-use" }
