[package]
name = "atmos-desktop"
version = "2026.7.27"
description = "Atmos desktop app powered by Tauri"
authors = ["atmos"]
edition = "2021"

[lib]
name = "atmos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Web inspector (Option+Cmd+I / open_devtools). Debug builds always enable it via
# debug_assertions. Do NOT enable this feature for production release builds —
# it injects the toggle-devtools shortcut and opens inspector for all webviews.
devtools = ["tauri/devtools"]

[dependencies]
serde = { workspace = true }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"
runtime-manager = { path = "../../../crates/runtime-manager", features = ["supervisor"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tunnel-connector = { path = "../../../crates/tunnel-connector" }
browser-cookies = { path = "../../../crates/browser-cookies" }
keyring = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = [
    "NSString",
    "NSDictionary",
    "NSArray",
    "NSSet",
    "NSDate",
    "NSHTTPCookie",
    "NSUUID",
    "NSProcessInfo",
    "NSObject",
    "block2",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKWebsiteDataStore",
    "WKHTTPCookieStore",
    "block2",
] }
block2 = "0.6"
