"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "desktop-app-commands"
description = "Allows first-party Atmos desktop webviews to call native desktop app commands."
commands.allow = [
  "appshot_accept_pending",
  "appshot_copy_record",
  "appshot_delete_record",
  "appshot_discard_pending",
  "appshot_list_records",
  "appshot_open_permissions",
  "appshot_read_records",
  "appshot_read_snapshot",
  "appshot_set_pending_auto_accept",
  "appshot_show_permissions_window",
  "appshot_status",
  "appshot_trigger_capture",
  "clear_client_session_cmd",
  "get_api_config",
  "get_local_computer_display_name",
  "get_version_info",
  "open_agent_chat_window",
  "open_in_external_editor",
  "open_preview_browser_window",
  "preview_bridge_clear_annotations",
  "preview_bridge_clear_selection",
  "preview_bridge_close",
  "preview_bridge_enter_pick_mode",
  "preview_bridge_hide",
  "preview_bridge_navigate",
  "preview_bridge_open",
  "preview_bridge_open_devtools",
  "preview_bridge_probe_url",
  "preview_bridge_set_detached",
  "preview_bridge_show",
  "preview_bridge_update_bounds",
  "send_notification",
  "tunnel_connector_clear_credential",
  "tunnel_connector_detect",
  "tunnel_connector_provider_guide",
  "tunnel_connector_recover",
  "tunnel_connector_renew",
  "tunnel_connector_save_credential",
  "tunnel_connector_start",
  "tunnel_connector_status",
  "tunnel_connector_stop",
  "write_log",
]
