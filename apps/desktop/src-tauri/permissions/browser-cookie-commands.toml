"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "browser-cookie-commands"
description = "Allows exactly the four local browser cookie sync commands. Kept separate from desktop-app-commands so these Keychain-touching / destructive commands are only reachable from the dedicated, webview-scoped browser-cookie-commands capability."
commands.allow = [
  "list_importable_browsers",
  "import_browser_cookies",
  "clear_browser_cache",
  "clear_browser_site_data",
]
