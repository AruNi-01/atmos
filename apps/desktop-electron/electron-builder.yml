# Production Atmos desktop packaging (Electron engine).
# Primary product identity: Atmos / com.atmos.desktop.

appId: com.atmos.desktop
productName: Atmos
copyright: Atmos

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!release/**"
  - "!resources/runtime/**"
  - "!scripts/**"
  - "!src/**"
  - "!**/*.test.ts"
  - "!tsconfig.json"

extraResources:
  - from: resources/runtime/current
    to: runtime/current
    filter:
      - "**/*"
  - from: resources/icons
    to: icons
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

asar: true
# koffi ships platform native binaries that must load outside asar.
# shift-helper-main is spawned via ELECTRON_RUN_AS_NODE and needs a real path.
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/dist/shift-helper-main.js"

# afterPack injects Assets.car + CFBundleIconName when actool ≥ 26 is available.
# (electron-builder's mac.icon=.icon path expects actool to also emit Icon.icns,
# which Xcode 26.3 does not — so we compile Liquid Glass ourselves.)
afterPack: scripts/after-pack-macos-icon.cjs

mac:
  category: public.app-category.developer-tools
  # Legacy ICNS for CFBundleIconFile + pre-Tahoe / DMG volume icon.
  # macOS 26 Liquid Glass: afterPack compiles resources/icons/icon.icon → Assets.car.
  icon: resources/icons/icon.icns
  # Default ad-hoc codesign (sealed resources). Avoids Gatekeeper "damaged" for
  # packages without Developer ID. Override with CSC_LINK + CSC_KEY_PASSWORD
  # (optional CSC_NAME) for production Developer ID signing.
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  # Arch selected by CI via `electron-builder --mac --arm64| --x64`.
  target:
    - dmg
    - zip
  # Local packages use a clean product name (like historical Tauri). CI renames
  # with version + arch before multi-arch GitHub Release upload.
  artifactName: Atmos.${ext}

dmg:
  # Mount volume name in Finder (not the download filename). Keep product-only —
  # avoid electron-builder's default "${productName} ${version}".
  title: Atmos
  artifactName: Atmos.${ext}
  # Minimal plain backdrop: slogan + arrow + drag caption only (no Atmos title / art).
  # Regenerate: python3 scripts/generate-dmg-background.py
  background: resources/dmg/background.png
  # Volume icon must remain .icns (not Icon Composer / Assets.car).
  icon: resources/icons/icon.icns
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 148
      y: 170
    - x: 392
      y: 170
      type: link
      path: /Applications

win:
  icon: resources/icons/icon.ico
  target:
    - nsis
  artifactName: Atmos.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Atmos-setup.${ext}

linux:
  icon: resources/icons
  category: Development
  target:
    - AppImage
  artifactName: Atmos.${ext}

# Never auto-publish to GitHub from electron-builder; CI attaches artifacts.
publish: null
