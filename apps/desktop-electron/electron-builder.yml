# APP-045 experimental Electron packaging.
# Separate identity from production Tauri (`Atmos` / com.atmos.desktop / desktop-* tags).
# Do not point publish at Tauri updater feeds.

appId: com.atmos.desktop.electron
productName: Atmos Electron
copyright: Atmos

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!release/**"
  - "!resources/runtime/**"
  - "!scripts/**"
  - "!src/**"
  - "!**/*.test.ts"
  - "!tsconfig.json"

extraResources:
  - from: resources/runtime/current
    to: runtime/current
    filter:
      - "**/*"
  - from: resources/icons
    to: icons
    filter:
      - "**/*"

asar: true
# koffi ships platform native binaries that must load outside asar.
asarUnpack:
  - "**/node_modules/koffi/**"

mac:
  category: public.app-category.developer-tools
  icon: resources/icons/icon.icns
  # Ad-hoc dogfood: full app-bundle codesign (sealed resources), same idea as
  # Tauri `APPLE_SIGNING_IDENTITY: '-'`. Avoids Gatekeeper "damaged" for
  # unsigned packages; users still confirm "unidentified developer".
  # Developer ID later: set CSC_LINK + CSC_KEY_PASSWORD (optional CSC_NAME).
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  # Arch selected by CI via `electron-builder --mac --arm64| --x64`.
  target:
    - dmg
    - zip
  artifactName: Atmos-Electron_${version}_${arch}.${ext}

dmg:
  artifactName: Atmos-Electron_${version}_${arch}.${ext}

win:
  icon: resources/icons/icon.ico
  target:
    - nsis
  artifactName: Atmos-Electron_${version}_${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Atmos-Electron_${version}_${arch}-setup.${ext}

linux:
  icon: resources/icons
  category: Development
  target:
    - AppImage
  artifactName: Atmos-Electron_${version}_${arch}.${ext}

# Never auto-publish to GitHub from electron-builder; CI attaches artifacts.
publish: null
