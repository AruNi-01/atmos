name: CI - Mobile iOS parity

# structural runs on matching pull requests.
# ios-simulator is the heavy macOS job (about 1–3 hours). It runs on
# workflow_dispatch, or when the PR has the label ios-parity.
# QUALITY-022 caches the generated ios/ tree (skip prebuild + pod install on
# exact hit) and Xcode DerivedData. Prefix restore-keys are not used for those
# two trees: run 39530230224 showed an exact DerivedData hit plus a full
# rebuild (49m vs 27m cold) because prebuild/pod install rewrote sources.
# Branch protection was checked before making that job opt-in (QUALITY-010):
# classic protection is 403 for this token, rulesets are empty, and merged
# PRs that do not touch these paths (#318, #312) merged without ios-simulator,
# so the check is not required.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "apps/mobile/**"
      - "packages/agent-transcript/**"
      - "scripts/agent-chat-parity/**"
      - ".github/workflows/ci-mobile-ios-parity.yml"

concurrency:
  group: ci-mobile-ios-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural:
    name: structural
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recording duration self-test
        run: python3 scripts/agent-chat-parity/mp4-duration.py --self-test

      - name: Command watcher self-test
        run: python3 scripts/agent-chat-parity/run-until-line.py --self-test

      - name: Screenshot flatness self-test
        run: python3 scripts/agent-chat-parity/png-flat.py --self-test

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: |
          set -euo pipefail
          # react-native-skia-apple-ios tarball extraction has failed once on a
          # warm runner (run 38803926761). Retry the same frozen install.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "bun install failed (attempt ${attempt})"
            sleep 15
          done
          exit 1

      - name: Mobile unit tests
        working-directory: apps/mobile
        run: bun test

      - name: Agent transcript tests
        run: bun --filter @atmos/agent-transcript test

      - name: Structural compare
        run: bun scripts/agent-chat-parity/compare.ts

      - name: Export fixture trees
        run: bun scripts/agent-chat-parity/export-trees.ts

      - name: Upload structural trees
        uses: actions/upload-artifact@v4
        with:
          name: parity-structural
          path: artifacts/structural
          if-no-files-found: error
          retention-days: 14

      - name: Export parity preview for web
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_PARITY_PREVIEW: "1"
        run: bunx expo export --platform web --output-dir "$GITHUB_WORKSPACE/artifacts/rn-web-dist"

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Screenshot react-native-web fixtures
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          RN_WEB_DIST: artifacts/rn-web-dist
          RN_WEB_OUT: artifacts/rn-web
        run: bun scripts/agent-chat-parity/rn-web-capture.ts

      - name: Upload react-native-web screenshots
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: parity-rn-web
          path: artifacts/rn-web
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: ios-simulator
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ios-parity'))
    runs-on: macos-26
    timeout-minutes: 180
    env:
      EXPO_PUBLIC_PARITY_PREVIEW: "1"
      LANG: en_US.UTF-8
      DERIVED_DATA: ${{ github.workspace }}/artifacts/derived
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: |
          set -euo pipefail
          # react-native-skia-apple-ios tarball extraction has failed once on a
          # warm runner (run 38803926761). Retry the same frozen install.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "bun install failed (attempt ${attempt})"
            sleep 15
          done
          exit 1

      - name: Select Xcode 26.5 and boot iPhone 17 Pro
        id: xcode
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcode_version="$(xcodebuild -version | awk 'NR==1 {v=$2} NR==2 {b=$3} END {printf "%s-%s", v, b}')"
          if [[ -z "$xcode_version" || "$xcode_version" == "-" ]]; then
            echo "could not parse xcodebuild -version" >&2
            xcodebuild -version >&2
            exit 1
          fi
          echo "version=${xcode_version}" >> "$GITHUB_OUTPUT"
          echo "xcode cache version: ${xcode_version}"
          if [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "scope=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "cache scope: pr-${PR_NUMBER}"
          else
            sanitized="${REF_NAME//\//-}"
            echo "scope=ref-${sanitized}" >> "$GITHUB_OUTPUT"
            echo "cache scope: ref-${sanitized}"
          fi
          # simctl screenshots stay black unless the simulator service starts
          # with the software framebuffer. The service is already running on
          # the runner image, so write the default and restart it before boot.
          defaults write com.apple.CoreSimulator.IndigoFramebufferServices FramebufferRendererHint -integer 3
          killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          sleep 2
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version
          echo "----- xcrun simctl list -----"
          xcrun simctl list

          if ! parsed="$(python3 - << 'PY'
          import json, subprocess, sys

          def run(args):
              return subprocess.check_output(args, text=True)

          devices = json.loads(run(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          runtimes = json.loads(run(["xcrun", "simctl", "list", "runtimes", "-j"]))
          runtime_id = ""
          for runtime in runtimes.get("runtimes", []):
              version = str(runtime.get("version", ""))
              name = str(runtime.get("name", ""))
              identifier = str(runtime.get("identifier", ""))
              if runtime.get("isAvailable") and (
                  version == "26.5" or name == "iOS 26.5" or identifier.endswith("iOS-26-5")
              ):
                  runtime_id = identifier
                  break
          if not runtime_id:
              print("iOS 26.5 simulator runtime is not installed", file=sys.stderr)
              sys.exit(2)

          bucket = devices.get("devices", {})
          runtime_devices = bucket.get(runtime_id, [])
          if not runtime_devices:
              for key, value in bucket.items():
                  if "iOS-26-5" in key:
                      runtime_id = key
                      runtime_devices = value
                      break

          udid = ""
          for device in runtime_devices:
              if device.get("name") == "iPhone 17 Pro" and device.get("isAvailable", True):
                  udid = str(device.get("udid", ""))
                  break
          print(runtime_id)
          print(udid)
          PY
          )"; then
            echo "Simulator pin failed. Full simctl list follows."
            xcrun simctl list
            exit 1
          fi

          runtime_id="$(printf '%s\n' "$parsed" | sed -n '1p')"
          udid="$(printf '%s\n' "$parsed" | sed -n '2p')"
          echo "runtime: ${runtime_id}"
          if [[ -z "$udid" ]]; then
            echo "Creating iPhone 17 Pro on ${runtime_id}"
            if ! udid="$(xcrun simctl create "iPhone 17 Pro" "iPhone 17 Pro" "$runtime_id")"; then
              echo "Could not create iPhone 17 Pro. Full simctl list follows."
              xcrun simctl list
              exit 1
            fi
            udid="$(printf '%s' "$udid" | tr -d '[:space:]')"
          fi
          echo "udid: ${udid}"

          # A connected hardware keyboard hides the software keyboard, so a
          # composer tap cannot show it. Write this before the simulator boots.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

          boot_status=0
          xcrun simctl boot "$udid" || boot_status=$?
          if [[ "$boot_status" -ne 0 ]]; then
            echo "simctl boot exited ${boot_status}; waiting for bootstatus"
          fi
          if ! xcrun simctl bootstatus "$udid" -b; then
            echo "Simulator did not boot. Full simctl list follows."
            xcrun simctl list
            exit 1
          fi
          xcrun simctl status_bar booted override --time "9:41" --batteryState charged --batteryLevel 100

      - name: Bake preview flag
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          printf 'EXPO_PUBLIC_PARITY_PREVIEW=1\n' > .env
          # Pod install reads expo.autolinking.exclude from this package.json,
          # not from app.config.js.
          bun ../../scripts/agent-chat-parity/exclude-dev-client.js package.json
          node -e 'const e=require("./package.json").expo.autolinking.exclude; if (!e.includes("expo-dev-client")) process.exit(1)'

      # QUALITY-022: cache the whole generated ios/ tree (Pods, lock, workspace,
      # pbxproj). Exact hit skips prebuild and pod install. No restore-keys:
      # a prefix tree plus a later prebuild mixes files. Hash inputs after the
      # exclude-dev-client mutation of package.json.
      - name: Restore generated iOS tree
        id: ios-restore
        uses: actions/cache/restore@v4
        with:
          path: apps/mobile/ios
          key: ios-gen-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.scope }}-${{ hashFiles('bun.lock', 'apps/mobile/package.json', 'apps/mobile/app.config.js', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'scripts/agent-chat-parity/exclude-dev-client.js') }}

      - name: Restore CocoaPods download cache
        if: success() && steps.ios-restore.outputs.cache-hit != 'true'
        id: podhome-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-podhome-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ios-podhome-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
            ios-podhome-${{ runner.os }}-

      - name: Prebuild iOS
        if: success() && steps.ios-restore.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          bunx expo prebuild -p ios --no-install
          node -e 'const e=require("./package.json").expo.autolinking.exclude; if (!e.includes("expo-dev-launcher")) { console.error("prebuild dropped the dev-client exclude"); process.exit(1) }'

      - name: Install CocoaPods
        if: success() && steps.ios-restore.outputs.cache-hit != 'true'
        id: pod-install
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          pod --version
          pod install
          if grep -E -q 'expo-dev-launcher|expo-dev-menu|expo-dev-client' Podfile.lock; then
            echo "parity prebuild still linked expo-dev-client" >&2
            exit 1
          fi
          echo "expo-dev-client is not in Podfile.lock"

      - name: Save CocoaPods download cache
        if: always() && !cancelled() && steps.ios-restore.outputs.cache-hit != 'true' && steps.pod-install.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-podhome-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('bun.lock') }}

      - name: Save generated iOS tree
        if: always() && !cancelled() && steps.ios-restore.outputs.cache-hit != 'true' && steps.pod-install.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: apps/mobile/ios
          key: ios-gen-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.scope }}-${{ hashFiles('bun.lock', 'apps/mobile/package.json', 'apps/mobile/app.config.js', 'apps/mobile/app.json', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'scripts/agent-chat-parity/exclude-dev-client.js') }}

      - name: Verify generated iOS tree
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node -e 'const e=require("./package.json").expo.autolinking.exclude; if (!e.includes("expo-dev-launcher")) { console.error("dev-client exclude missing after iOS tree restore"); process.exit(1) }'
          # The Xcode bundle phase sources this file before Expo inlines EXPO_PUBLIC_*.
          printf 'export EXPO_PUBLIC_PARITY_PREVIEW=1\n' > ios/.xcode.env.local
          info_plist="$(find ios -name Info.plist -path '*Atmos/Info.plist' -print -quit)"
          if [[ -z "$info_plist" ]]; then
            echo "Atmos Info.plist missing" >&2
            find ios -name Info.plist >&2 || true
            exit 1
          fi
          # QUALITY-011 requires Atmos.SceneDelegate. Do not restore the gate that
          # failed whenever Info.plist contained UISceneDelegateClassName.
          bash script/verify-ios-scene-lifecycle.sh structural
          if [[ ! -f ios/Podfile.lock ]]; then
            echo "Podfile.lock missing" >&2
            exit 1
          fi
          if grep -E -q 'expo-dev-launcher|expo-dev-menu|expo-dev-client' ios/Podfile.lock; then
            echo "parity prebuild still linked expo-dev-client" >&2
            exit 1
          fi
          echo "generated iOS tree is ready"

      # QUALITY-022: exact key only. restore-keys pulled in a 1.5 GB tree that
      # still fully recompiled (run 39530230224 attempt 2).
      - name: Restore DerivedData cache
        id: deriveddata-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.scope }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      - name: Normalize native input mtimes for incremental xcodebuild
        if: success() && steps.deriveddata-restore.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          # Checkout and bun install stamp files with "now". Clang then treats
          # every translation unit as newer than the restored .o files.
          python3 - << 'PY'
          import os
          ref = os.stat("bun.lock")
          times = (ref.st_atime, ref.st_mtime)
          roots = (
              "node_modules",
              "apps/mobile/node_modules",
              "apps/mobile/ios",
              "apps/mobile/modules",
          )
          updated = 0
          for root in roots:
              if not os.path.isdir(root):
                  continue
              for dirpath, _dirnames, filenames in os.walk(root):
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      try:
                          os.utime(path, times)
                          updated += 1
                      except OSError:
                          pass
          print(f"pinned {updated} native-input mtimes to bun.lock")
          PY

      - name: Build Release simulator app
        id: xcodebuild
        run: |
          set -euo pipefail
          shopt -s nullglob
          workspace=""
          if [[ -d apps/mobile/ios/Atmos.xcworkspace ]]; then
            workspace="apps/mobile/ios/Atmos.xcworkspace"
          else
            for candidate in apps/mobile/ios/*.xcworkspace; do
              [[ -d "$candidate" ]] || continue
              base="$(basename "$candidate")"
              [[ "$base" == "project.xcworkspace" ]] && continue
              workspace="$candidate"
              break
            done
          fi
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace under apps/mobile/ios" >&2
            ls -la apps/mobile/ios >&2 || true
            exit 1
          fi

          list_output="$(xcodebuild -workspace "$workspace" -list 2>&1)" || {
            printf '%s\n' "$list_output"
            exit 1
          }
          printf '%s\n' "$list_output"
          # Heredoc owns stdin, so the list is passed in the environment.
          if ! scheme="$(LIST_OUTPUT="$list_output" python3 - << 'PY'
          import os, sys
          text = os.environ.get("LIST_OUTPUT", "").splitlines()
          schemes = []
          in_schemes = False
          for line in text:
              if line.strip() == "Schemes:":
                  in_schemes = True
                  continue
              if not in_schemes:
                  continue
              if line.strip() == "":
                  continue
              if not line.startswith("        "):
                  break
              schemes.append(line.strip())
          if "Atmos" not in schemes:
              print("scheme Atmos was not in xcodebuild -list", file=sys.stderr)
              print("\n".join(schemes), file=sys.stderr)
              sys.exit(1)
          print("Atmos")
          PY
          )"; then
            echo "Scheme detection failed. xcodebuild -list output is above."
            exit 1
          fi
          echo "scheme: ${scheme}"
          echo "destination: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"

          derived="${DERIVED_DATA:-$GITHUB_WORKSPACE/artifacts/derived}"
          mkdir -p "$derived"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -derivedDataPath "$derived" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee /tmp/atmos-xcodebuild.log
          compilec="$(grep -c 'CompileC ' /tmp/atmos-xcodebuild.log || true)"
          echo "compilec=${compilec}" >> "$GITHUB_OUTPUT"
          echo "CompileC count: ${compilec}"

          app="$derived/Build/Products/Release-iphonesimulator/Atmos.app"
          if [[ ! -d "$app" ]]; then
            # pipefail plus head would turn find's SIGPIPE into a failed step.
            set +o pipefail
            app="$(find "$derived/Build/Products" -maxdepth 4 -type d -name '*.app' -path '*Release-iphonesimulator/*' ! -path '*/PlugIns/*' | head -n 1)"
            set -o pipefail
          fi
          if [[ -z "$app" || ! -d "$app" ]]; then
            echo "Release simulator app not found under ${derived}" >&2
            find "$derived/Build/Products" -maxdepth 5 -name '*.app' >&2 || true
            exit 1
          fi
          echo "app: ${app}"
          bundle="$app/main.jsbundle"
          if [[ ! -f "$bundle" ]]; then
            echo "main.jsbundle missing from ${app}" >&2
            find "$app" -name '*.jsbundle' -o -name '*.hbc' >&2 || true
            exit 1
          fi
          if grep -a -q 'EXPO_PUBLIC_PARITY_PREVIEW' "$bundle"; then
            echo "EXPO_PUBLIC_PARITY_PREVIEW was not inlined into main.jsbundle" >&2
            exit 1
          fi
          # Hermes -O drops this string when the flag is not "1" (the route returns null).
          if ! grep -a -q '\[parity\] preview-chat route' "$bundle"; then
            echo "parity preview route was not compiled in; EXPO_PUBLIC_PARITY_PREVIEW was not inlined as 1" >&2
            exit 1
          fi
          echo "parity preview flag is inlined into main.jsbundle"
          echo "main.jsbundle bytes: $(wc -c < "$bundle" | tr -d ' ')"
          # RN 0.85 turns the new architecture on unless RCT_NEW_ARCH_ENABLED=0.
          # Run 38780693297 painted fixtures with that default, so Fabric is not
          # the black-window cause. Print the built value and keep going.
          echo "RCTNewArchEnabled=$(plutil -extract RCTNewArchEnabled raw -o - "$app/Info.plist" 2>/dev/null || echo absent)"
          # Same rule on the built plist: Atmos.SceneDelegate must be present.
          bash apps/mobile/script/verify-ios-scene-lifecycle.sh built-plist "$app/Info.plist"
          printf '%s\n' "$app" > "$GITHUB_WORKSPACE/artifacts/simulator-app-path.txt"

      - name: Prune DerivedData before cache save
        if: success() && !cancelled()
        run: |
          set -euo pipefail
          rm -rf "${DERIVED_DATA}/Logs" "${DERIVED_DATA}/Index.noindex"

      - name: Save DerivedData cache
        if: success() && !cancelled() && steps.xcodebuild.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-dd-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.scope }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      - name: Install, launch, and capture
        run: |
          set -euo pipefail
          app="$(cat "$GITHUB_WORKSPACE/artifacts/simulator-app-path.txt")"
          xcrun simctl install booted "$app"
          bash scripts/agent-chat-parity/ios-capture.sh

      - name: Write summary
        if: always() && !cancelled()
        env:
          IOS_HIT: ${{ steps.ios-restore.outputs.cache-hit }}
          IOS_KEY: ${{ steps.ios-restore.outputs.cache-matched-key }}
          PODHOME_HIT: ${{ steps.podhome-restore.outputs.cache-hit }}
          PODHOME_KEY: ${{ steps.podhome-restore.outputs.cache-matched-key }}
          DD_HIT: ${{ steps.deriveddata-restore.outputs.cache-hit }}
          DD_KEY: ${{ steps.deriveddata-restore.outputs.cache-matched-key }}
          COMPILEC: ${{ steps.xcodebuild.outputs.compilec }}
          XCODE_CACHE_VERSION: ${{ steps.xcode.outputs.version }}
          CACHE_SCOPE: ${{ steps.xcode.outputs.scope }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "# iOS parity capture"
            echo
            echo "- xcode-select: $(xcode-select -p)"
            echo "- xcodebuild:"
            xcodebuild -version | sed 's/^/  /'
            echo "- simulator device: iPhone 17 Pro"
            echo "- cache xcode version: ${XCODE_CACHE_VERSION}"
            echo "- cache scope: ${CACHE_SCOPE}"
            echo "- ios-gen cache-hit: ${IOS_HIT}"
            echo "- ios-gen cache-matched-key: ${IOS_KEY}"
            echo "- cocoapods-home cache-hit: ${PODHOME_HIT}"
            echo "- cocoapods-home cache-matched-key: ${PODHOME_KEY}"
            echo "- deriveddata cache-hit: ${DD_HIT}"
            echo "- deriveddata cache-matched-key: ${DD_KEY}"
            echo "- CompileC count: ${COMPILEC}"
            echo "- Phone PNGs in this artifact are iOS Simulator frames."
            echo "- react-native-web comparison PNGs, when the ubuntu job finishes, are artifact parity-rn-web. They are not iOS and not Next."
            echo "- S31 Next.js web PNGs were not produced."
          } > artifacts/summary.md

      - name: Upload ios-parity
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-parity
          path: |
            artifacts/phone
            artifacts/summary.md
          if-no-files-found: error
          retention-days: 14
