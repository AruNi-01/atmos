# QUALITY-021. Advanced setup. Default setup must be switched off in
# Settings → Code security before this workflow can upload SARIF.
# No `run:` step: do not expand ${{ }} in a shell.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "specs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.svg"
      - "**/*.ico"
      - "**/*.avif"
      - "**/*.bmp"
      - "**/*.mp4"
      - "**/*.mov"
      - "**/*.webm"
      - "**/*.mp3"
      - "**/*.wav"
      - "**/*.ogg"
      - "**/*.pdf"
      - "**/*.woff"
      - "**/*.woff2"
      - "**/*.ttf"
      - "**/*.otf"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
