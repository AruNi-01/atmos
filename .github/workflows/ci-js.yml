name: CI - JS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PRs: cancel superseded runs on the same PR.
# main push / workflow_dispatch: share github.ref so in-progress runs finish and
# newer runs queue. Do not put run_id in this group — that would skip the queue.
# GitHub still drops *pending* runs in the group when a newer one is queued.
concurrency:
  group: js-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oxlint:
    name: oxlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Default fetch-depth is already 1 (shallow). blob:none is the extra
          # partial-clone filter; working tree blobs for HEAD are still fetched.
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - name: oxlint
        run: bun lint

  oxfmt:
    name: oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - name: oxfmt --check
        run: bun run fmt:check
