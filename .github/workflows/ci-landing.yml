name: CI - Landing

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - ".oxlintrc.jsonc"
      - ".oxfmtrc.json"
      - ".github/workflows/ci-landing.yml"
      - ".github/actions/setup-bun/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - ".oxlintrc.jsonc"
      - ".oxfmtrc.json"
      - ".github/workflows/ci-landing.yml"
      - ".github/actions/setup-bun/**"

permissions:
  contents: read

# PRs: cancel superseded runs on the same PR.
# main push: share github.ref so in-progress runs finish and newer runs queue.
# This workflow has no workflow_dispatch. Do not put run_id in this group —
# that would skip the queue. GitHub still drops *pending* runs in the group
# when a newer one is queued.
concurrency:
  group: landing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - name: Lint landing
        run: bun --filter landing lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - name: Typecheck landing
        run: bun --filter landing typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - name: Build landing
        run: bun --filter landing build
        env:
          SKIP_ENV_VALIDATION: true
