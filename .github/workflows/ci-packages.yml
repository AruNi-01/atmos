name: CI - Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".oxlintrc.jsonc"
      - ".oxfmtrc.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/actions/setup-bun/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - ".oxlintrc.jsonc"
      - ".oxfmtrc.json"
      - ".github/workflows/ci-packages.yml"
      - ".github/actions/setup-bun/**"

permissions:
  contents: read

# PRs: cancel superseded runs on the same PR.
# main push / workflow_dispatch: share github.ref so in-progress runs finish and
# newer runs queue. Do not put run_id in this group — that would skip the queue.
# GitHub still drops *pending* runs in the group when a newer one is queued.
concurrency:
  group: packages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      - name: Lint packages
        run: bunx oxlint packages

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup-bun
      # config 包无需 typecheck（纯 JSON 配置），其余三个包均有 typecheck 脚本
      - name: Typecheck packages
        run: |
          bun --filter '@workspace/ui' typecheck
          bun --filter '@atmos/i18n' typecheck
          bun --filter '@atmos/shared' typecheck
