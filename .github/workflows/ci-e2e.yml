name: CI - E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "crates/**"
      - "packages/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci-e2e.yml"
      - ".github/actions/setup-bun/**"
      - ".github/actions/setup-e2e/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "crates/**"
      - "packages/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci-e2e.yml"
      - ".github/actions/setup-bun/**"
      - ".github/actions/setup-e2e/**"
  workflow_dispatch:
    inputs:
      target:
        description: "E2E target to run"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all-smoke
          - smoke-stateless
          - smoke-stateful
          - smoke-routes
          - smoke-onboarding
          - smoke-app-shell
          - smoke-project
          - smoke-settings
          - smoke-workspace
          - specs
          - full
      publish_report:
        description: "Publish merged HTML report to GitHub Pages"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      should_run: ${{ steps.plan.outputs.should_run }}
      publish_report: ${{ steps.plan.outputs.publish_report }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            any_frontend:
              - "apps/web/**"
              - "apps/api/**"
              - "crates/**"
              - "packages/**"
              - "e2e/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Justfile"
              - "justfile"
              - "package.json"
              - "bun.lock"
              - ".github/workflows/ci-e2e.yml"
              - ".github/actions/setup-bun/**"
              - ".github/actions/setup-e2e/**"
            global:
              - "e2e/fixtures/**"
              - "e2e/package.json"
              - "e2e/scripts/**"
              - "e2e/playwright.config.ts"
              - "e2e/tests/smoke/support/**"
              - "apps/web/package.json"
              - "apps/api/**"
              - "crates/**"
              - "apps/web/src/app-shell/**"
              - "apps/web/src/app/[[]locale[]]/**"
              - "apps/web/src/providers/**"
              - "apps/web/src/shared/**"
              - "packages/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Justfile"
              - "justfile"
              - "package.json"
              - "bun.lock"
              - ".github/workflows/ci-e2e.yml"
              - ".github/actions/setup-bun/**"
              - ".github/actions/setup-e2e/**"
            routes:
              - "e2e/tests/smoke/routes/**"
            onboarding:
              - "e2e/tests/smoke/onboarding/**"
              - "apps/web/src/app/[[]locale[]]/setup/**"
              - "apps/web/src/features/atmos-computer/**"
              - "apps/web/src/features/connection/**"
              - "apps/web/src/features/local-services/**"
              - "apps/web/src/features/tunnel-connector/**"
              - "apps/web/src/features/welcome/**"
            app_shell:
              - "e2e/tests/smoke/app-shell/**"
              - "apps/web/src/app-shell/**"
            project:
              - "e2e/tests/smoke/project/**"
              - "apps/web/src/features/project/**"
            settings:
              - "e2e/tests/smoke/settings/**"
              - "apps/web/src/features/settings/**"
            workspace:
              - "e2e/tests/smoke/workspace/**"
              - "apps/web/src/features/canvas/**"
              - "apps/web/src/features/editor/**"
              - "apps/web/src/features/files/**"
              - "apps/web/src/features/git/**"
              - "apps/web/src/features/selection/**"
              - "apps/web/src/features/terminal/**"
              - "apps/web/src/features/wiki/**"
              - "apps/web/src/features/workspace/**"
            specs:
              - "e2e/tests/specs/**"

      - name: Build suite plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
          TARGET: ${{ github.event.inputs.target || 'auto' }}
          REQUESTED_PUBLISH_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_report && 'true' || 'false' }}
          ANY_FRONTEND: ${{ steps.changes.outputs.any_frontend }}
          GLOBAL: ${{ steps.changes.outputs.global }}
          ROUTES: ${{ steps.changes.outputs.routes }}
          ONBOARDING: ${{ steps.changes.outputs.onboarding }}
          APP_SHELL: ${{ steps.changes.outputs.app_shell }}
          PROJECT: ${{ steps.changes.outputs.project }}
          SETTINGS: ${{ steps.changes.outputs.settings }}
          WORKSPACE: ${{ steps.changes.outputs.workspace }}
          SPECS: ${{ steps.changes.outputs.specs }}
        run: node e2e/scripts/plan-ci-suites.cjs

  run:
    name: E2E - ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-e2e

      - name: Build API server
        run: cargo build --bin api

      - name: Run suite
        working-directory: e2e
        env:
          CI: "1"
        run: bun ./scripts/run-ci-suite.mjs "${{ matrix.suite }}"

      - name: Upload blob report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.suite }}
          path: e2e/reports/blob/${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge reports
    needs: [plan, run]
    if: ${{ always() && !cancelled() && needs.plan.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-pages-report
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      html_artifact_name: ${{ steps.meta.outputs.html_artifact_name }}
      report_url: ${{ steps.pages_meta.outputs.report_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bun

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-blob-*
          merge-multiple: true
          path: e2e/reports/blob-merged

      - name: Merge Playwright reports
        working-directory: e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: reports/merged/html
          PLAYWRIGHT_JSON_OUTPUT_DIR: reports/merged
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: bunx playwright merge-reports --reporter=html,json ./reports/blob-merged

      - name: Record artifact metadata
        id: meta
        run: echo "html_artifact_name=playwright-html-report" >> "$GITHUB_OUTPUT"

      - name: Write GitHub summary
        working-directory: e2e
        run: node scripts/write-e2e-summary.cjs

      - name: Upload merged HTML report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: e2e/reports/merged/html
          if-no-files-found: error
          retention-days: 14

      - name: Upload merged JSON report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: e2e/reports/merged/results.json
          if-no-files-found: error
          retention-days: 14

      # Existing Pages tree is pruned + re-published each run so zip/webm history
      # cannot grow past GitHub Pages' ~1GB soft limit (which caused report 404s).
      - name: Checkout existing Pages reports for retention
        if: needs.plan.outputs.publish_report == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: e2e/reports/gh-pages-existing
          fetch-depth: 1

      - name: Prepare GitHub Pages content
        if: needs.plan.outputs.publish_report == 'true'
        id: pages_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PAGES_EXISTING_ROOT: reports/gh-pages-existing
        working-directory: e2e
        run: node scripts/prepare-pages-report.cjs

      - name: Deploy GitHub Pages report branch
        if: needs.plan.outputs.publish_report == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: e2e/reports/pages-site
          # Full pruned site each time — do not accumulate multi-GB history.
          keep_files: false
          force_orphan: true
          enable_jekyll: false

      - name: Resolve published gh-pages tip
        if: needs.plan.outputs.publish_report == 'true'
        id: pages_tip
        run: |
          sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          if [ -z "$sha" ]; then
            echo "Could not resolve gh-pages tip after deploy" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved gh-pages tip: $sha"

      - name: Wait for GitHub Pages build
        if: needs.plan.outputs.publish_report == 'true'
        id: wait_pages
        uses: actions/github-script@v7
        env:
          PAGES_COMMIT_SHA: ${{ steps.pages_tip.outputs.sha }}
        with:
          script: |
            const expectedSha = process.env.PAGES_COMMIT_SHA;
            if (!expectedSha) {
              core.setFailed("Missing published gh-pages tip SHA.");
              return;
            }

            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: builds } = await github.rest.repos.listPagesBuilds({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 10,
              });
              const match = builds.find((build) => build.commit === expectedSha);
              if (!match) {
                core.info(`Pages build for ${expectedSha.slice(0, 7)} not listed yet.`);
              } else {
                core.info(`Pages build ${match.commit.slice(0, 7)} status=${match.status}`);
                if (match.status === "built") {
                  core.setOutput("pages_ready", "true");
                  return;
                }
                if (match.status === "errored") {
                  core.setFailed(match.error?.message || "GitHub Pages build failed");
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }
            core.setFailed(
              `Timed out waiting for GitHub Pages build of ${expectedSha.slice(0, 7)}; skipping report comment so prior links stay usable.`,
            );

      - name: Comment on pull request with report URL
        if: >-
          needs.plan.outputs.publish_report == 'true'
          && github.event_name == 'pull_request'
          && steps.wait_pages.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.pages_meta.outputs.report_url }}
          SELECTED_SUITES: ${{ needs.plan.outputs.suites }}
        with:
          script: |
            const {
              buildExpiredPrCommentBody,
              buildPrCommentBody,
              isE2eReportComment,
              isExpiredE2eReportComment,
              readJsonReport,
            } = require("./e2e/scripts/e2e-report-utils.cjs");
            const report = readJsonReport("e2e/reports/merged/results.json");
            if (!report) {
              core.setFailed("Merged JSON report was not generated.");
              return;
            }

            const issue_number = context.issue.number;
            const runId = String(context.runId);
            let suites = [];
            try {
              suites = JSON.parse(process.env.SELECTED_SUITES || "[]");
            } catch {
              suites = [];
            }
            const body = buildPrCommentBody(report, process.env.REPORT_URL, {
              runId,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              suites,
            });

            // Paginate so older report comments are still found and expired.
            const priorComments = [];
            for (let page = 1; page <= 10; page += 1) {
              const { data } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
                page,
              });
              if (data.length === 0) break;
              priorComments.push(...data);
              if (data.length < 100) break;
            }

            const activeReportComments = priorComments.filter(
              (comment) =>
                comment.user?.type === "Bot" &&
                isE2eReportComment(comment.body) &&
                !isExpiredE2eReportComment(comment.body),
            );

            for (const comment of activeReportComments) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: buildExpiredPrCommentBody(comment.body, {
                  supersededByRunId: runId,
                }),
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Write GitHub summary with published report URL
        if: needs.plan.outputs.publish_report == 'true' && steps.wait_pages.outcome == 'success'
        run: |
          {
            echo "### Published HTML report"
            echo
            echo "- GitHub Pages URL: ${{ steps.pages_meta.outputs.report_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
