name: Setup Bun
description: Install Bun and project dependencies (frozen lockfile)

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # lockfileVersion 2 requires Bun >= 1.4 (1.3.x fails with Unknown lockfile version)
        bun-version: 1.4.0

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
