name: Setup Bun
description: Install Bun and project dependencies (frozen lockfile)

runs:
  using: composite
  steps:
    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@v2
      with:
        # Stable release that supports this repo's lockfileVersion 1.
        # (Bun 1.4.x is canary-only as of 2026-07; lockfileVersion 2 requires canary.)
        bun-version: 1.3.14

    # Dependency cache for `bun install` (registry tarballs).
    # Path: ~/.bun/install/cache — not node_modules (Bun: linking from this cache
    # is faster and avoids stale node_modules). oven-sh/setup-bun still only
    # caches the Bun binary (no-cache: false by default).
    #
    # Primary key inputs (no branch name):
    # - runner.os / runner.arch
    # - installed Bun version (steps.setup-bun.outputs.bun-version)
    # - hashFiles('bun.lock') — root lockfile used by frozen-lockfile install
    #
    # GitHub already scopes caches per-ref. Putting the branch in the key made
    # every PR save an extra ~850MB copy of the same lockfile and pushed the
    # repo over the 10GB Actions cache cap. Restore still falls back across
    # keys on this OS/arch/Bun; save runs only on main after an exact miss.
    - name: Restore bun install cache
      id: bun-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-bun${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ runner.arch }}-bun${{ steps.setup-bun.outputs.bun-version }}-

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        # npm tarball extraction flakes on warm runners (workerd, mermaid,
        # react-native-skia). ci-mobile-ios-parity retries the same install.
        for attempt in 1 2 3; do
          if bun install --frozen-lockfile; then
            exit 0
          fi
          echo "bun install failed (attempt ${attempt})"
          sleep 15
        done
        exit 1

    - name: Save bun install cache
      if: ${{ github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-bun${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
