name: Setup Bun
description: Install Bun and project dependencies (frozen lockfile)

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Stable release that supports this repo's lockfileVersion 1.
        # (Bun 1.4.x is canary-only as of 2026-07; lockfileVersion 2 requires canary.)
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
